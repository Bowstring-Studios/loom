<meta charset="utf-8">
<title>Loom</title>
<link rel="artifact-thumbnail" href="thumb.jpg">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: fixed left sidebar (collapses to a wrapping top rail under 760px) + scrolling main.
     Views are hash-routed: #dashboard #projects #project-<id> #time #resourcing #billing #integrations */
  :root{
    /* Light-first, Linear-leaning palette: near-neutral paper ground, a
       single muted ink accent, color used only to carry status/meaning. */
    --bg:#f6f5f1;
    --panel:#ffffff;
    --panel-raised:#efeeea;
    --panel-raised-2:#e4e2db;
    --border:rgba(20,18,14,.09);
    --border-soft:rgba(20,18,14,.055);
    --fg:#1c1b17;
    --fg-dim:#5c5a52;
    --fg-faint:#8a8780;
    --accent:#3f6659;
    --accent-deep:#2f4f45;
    --accent-ink:#ffffff;
    --accent2:#5a6678;
    --ok:#3f7a52;
    --ok-bg:rgba(63,122,82,.12);
    --warn:#92670f;
    --warn-bg:rgba(146,103,15,.12);
    --bad:#9c4335;
    --bad-bg:rgba(156,67,53,.12);
    --font-display:'Inter',system-ui,sans-serif;
    --font-body:'Inter',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b0b0a; --panel:#141412; --panel-raised:#1c1c19; --panel-raised-2:#262622;
      --border:rgba(255,255,255,.07); --border-soft:rgba(255,255,255,.045);
      --fg:#eae8e2; --fg-dim:#9c9a92; --fg-faint:#6a6862;
      --accent:#5e8577; --accent-deep:#44685c; --accent-ink:#ffffff; --accent2:#8b96a8;
      --ok:#6a9a74; --ok-bg:rgba(106,154,116,.14);
      --warn:#b58a4a; --warn-bg:rgba(181,138,74,.14);
      --bad:#ad5c4e; --bad-bg:rgba(173,92,78,.14);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0b0a; --panel:#141412; --panel-raised:#1c1c19; --panel-raised-2:#262622;
    --border:rgba(255,255,255,.07); --border-soft:rgba(255,255,255,.045);
    --fg:#eae8e2; --fg-dim:#9c9a92; --fg-faint:#6a6862;
    --accent:#5e8577; --accent-deep:#44685c; --accent-ink:#ffffff; --accent2:#8b96a8;
    --ok:#6a9a74; --ok-bg:rgba(106,154,116,.14);
    --warn:#b58a4a; --warn-bg:rgba(181,138,74,.14);
    --bad:#ad5c4e; --bad-bg:rgba(173,92,78,.14);
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);
    font-size:13px;line-height:1.5;
  }
  a{color:inherit;text-decoration:none;}
  button,select,input{font-family:var(--font-body);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--panel-raised-2);border-radius:3px;}

  .shell{display:flex;min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:216px;flex:none;background:var(--panel);border-right:1px solid var(--border-soft);
    display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
    padding:16px 10px max(14px,env(safe-area-inset-bottom,0px));
    padding-left:max(12px, env(safe-area-inset-left, 0px));
  }
  .brand{
    display:flex;align-items:center;gap:8px;padding:6px;margin:0 0 14px;
    border-radius:4px;cursor:default;
  }
  .brand:hover{background:var(--panel-raised);}
  .brand-text{display:flex;flex-direction:column;line-height:1.2;min-width:0;flex:1;}
  .brand-text .product{font-family:var(--font-display);font-weight:650;font-size:13.5px;letter-spacing:0;}
  .brand-text .maker{font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--fg-faint);margin-top:1px;}
  .maker b{color:var(--fg-dim);font-weight:600;}
  .brand .chev{flex:none;color:var(--fg-faint);}

  nav.primary{display:flex;flex-direction:column;gap:1px;margin-bottom:16px;}
  .nav-item{
    position:relative;display:flex;align-items:center;gap:8px;padding:5px 8px 5px 10px;border-radius:4px;
    color:var(--fg-dim);font-size:13px;font-weight:450;cursor:pointer;border:none;background:transparent;
    width:100%;text-align:left;
  }
  .nav-item svg{flex:none;opacity:.75;width:14px;height:14px;}
  .nav-item:hover{background:var(--panel-raised);color:var(--fg);}
  .nav-item.active{background:var(--panel-raised-2);color:var(--fg);font-weight:600;}
  .nav-item.active::before{
    content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
    width:2px;height:14px;background:var(--fg);
  }
  .nav-item.active svg{opacity:1;}

  .side-section{margin-top:8px;}
  .side-section h3{
    font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--fg-faint);
    margin:0 0 6px 10px;font-weight:600;
  }
  .side-project{
    display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:4px;cursor:pointer;
    font-size:12px;color:var(--fg-dim);
  }
  .side-project:hover{background:var(--panel-raised);color:var(--fg);}
  .side-project .dot{width:5px;height:5px;border-radius:50%;flex:none;}
  .side-project span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .sidebar-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--border-soft);display:flex;align-items:center;gap:8px;}
  .avatar{
    width:26px;height:26px;border-radius:5px;background:var(--panel-raised-2);color:var(--fg);
    display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;flex:none;
    font-family:var(--font-display);border:1px solid var(--border);
  }
  .me{display:flex;flex-direction:column;min-width:0;}
  .me b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .me span{font-size:10.5px;color:var(--fg-faint);}
  .theme-toggle{display:flex;gap:2px;background:var(--panel-raised);border:1px solid var(--border);border-radius:4px;padding:2px;margin-left:auto;}
  .theme-toggle button{appearance:none;border:none;background:transparent;color:var(--fg-dim);width:22px;height:20px;border-radius:3px;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;}
  .theme-toggle button.active{background:var(--panel-raised-2);color:var(--fg);}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;padding:18px clamp(14px,2.6vw,28px) 36px;padding-right:max(clamp(14px,2.6vw,28px), calc(env(safe-area-inset-right,0px) + 14px));}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
  .topbar h1{font-family:var(--font-display);font-size:17px;font-weight:650;margin:0;letter-spacing:-.1px;}
  .crumb{font-size:11.5px;color:var(--fg-faint);margin-bottom:3px;}
  .crumb a:hover{color:var(--fg);}
  .search{
    display:flex;align-items:center;gap:7px;background:var(--panel-raised);border:1px solid var(--border);
    border-radius:4px;padding:6px 10px;min-width:190px;
  }
  .search input{background:none;border:none;color:var(--fg);font-size:12.5px;outline:none;width:100%;}
  .search input::placeholder{color:var(--fg-faint);}
  .btn{
    appearance:none;cursor:pointer;border:1px solid var(--border);border-radius:4px;padding:0 12px;
    height:30px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    font-size:12.5px;font-weight:500;background:var(--panel);color:var(--fg-dim);
    transition:background .12s,color .12s,border-color .12s;
  }
  .btn:hover{color:var(--fg);border-color:var(--fg-faint);background:var(--panel-raised);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
  .btn-accent:hover{background:var(--accent-deep);border-color:var(--accent-deep);color:var(--accent-ink);}
  .num{text-align:right !important;}

  .tabbar{display:flex;gap:18px;border-bottom:1px solid var(--border-soft);}
  .view-mode-btn, .proj-tab-btn{
    appearance:none;cursor:pointer;border:none;background:transparent;outline:none;
    padding:0 0 8px;font-size:12.5px;font-weight:500;color:var(--fg-faint);
    border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .view-mode-btn:hover, .proj-tab-btn:hover{color:var(--fg-dim);}
  .view-mode-btn.active, .proj-tab-btn.active{color:var(--fg);font-weight:600;border-bottom-color:var(--fg);}

  /* ---------- Shared bits ---------- */
  .grid-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border-soft);border:1px solid var(--border);border-radius:5px;margin-bottom:16px;overflow:hidden;}
  @media (max-width:860px){.grid-kpi{grid-template-columns:repeat(2,1fr);}}
  .kpi{background:var(--panel);padding:12px 14px;min-width:0;}
  .kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--fg-faint);font-weight:600;margin-bottom:6px;}
  .kpi .vrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .kpi .v{font-family:var(--font-display);font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;}
  .kpi .d{font-size:11px;color:var(--fg-faint);margin-top:3px;}
  .kpi .d.up{color:var(--ok);}
  .kpi .d.down{color:var(--bad);}
  .delta{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;}
  .delta.up{color:var(--ok);}
  .delta.down{color:var(--bad);}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:14px 16px;min-width:0;}
  .panel + .panel{margin-top:14px;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;flex-wrap:wrap;}
  .panel-head h2{font-family:var(--font-display);font-size:12.5px;font-weight:600;margin:0;letter-spacing:0;}
  .panel-head .sub{font-size:11px;color:var(--fg-faint);}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:450;color:var(--fg-dim);white-space:nowrap;}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;flex:none;background:var(--fg-faint);}
  .pill.ok::before{background:var(--ok);}
  .pill.warn::before{background:var(--warn);}
  .pill.bad::before{background:var(--bad);}
  .pill.done::before{background:var(--fg-faint);}

  .bar-track{height:4px;border-radius:2px;background:var(--panel-raised-2);overflow:hidden;}
  .bar-fill{height:100%;border-radius:2px;}
  .bar-fill.ok{background:var(--ok);}
  .bar-fill.warn{background:var(--warn);}
  .bar-fill.bad{background:var(--bad);}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--fg-faint);
     padding:0 10px 8px;font-weight:600;}
  td{padding:9px 10px;border-top:1px solid var(--border-soft);vertical-align:middle;}
  tr.row-link{cursor:pointer;}
  tr.row-link:hover td{background:var(--panel-raised);}
  .scroll-x{overflow-x:auto;}
  .nowrap{white-space:nowrap;}
  .muted{color:var(--fg-faint);}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}

  .project-row-name{display:flex;align-items:center;gap:9px;min-width:0;}
  .client-dot{width:6px;height:6px;border-radius:50%;flex:none;}
  .pname{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pclient{font-size:11px;color:var(--fg-faint);}

  .avatars-stack{display:flex;}
  .avatars-stack .avatar{width:22px;height:22px;font-size:9px;margin-left:-6px;border:2px solid var(--panel);}
  .avatars-stack .avatar:first-child{margin-left:0;}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1px;background:var(--border-soft);border:1px solid var(--border);border-radius:5px;overflow:hidden;}
  .pcard{background:var(--panel);padding:14px;cursor:pointer;transition:background .12s;}
  .pcard:hover{background:var(--panel-raised);}
  .pcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
  .pcard h3{font-family:var(--font-display);font-size:13px;font-weight:600;margin:0 0 2px;}
  .pcard .client{font-size:11.5px;color:var(--fg-faint);margin-bottom:10px;}
  .pcard .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--fg-faint);margin-top:8px;}

  /* ---------- Timesheet ---------- */
  .ts-table th, .ts-table td{text-align:center;}
  .ts-table td:first-child, .ts-table th:first-child{text-align:left;min-width:150px;}
  .ts-input{
    width:44px;text-align:center;background:var(--panel-raised);border:1px solid var(--border);
    border-radius:4px;padding:5px 4px;color:var(--fg);font-size:12px;font-family:var(--font-mono);
  }
  .ts-input:focus{outline:1.5px solid var(--accent);outline-offset:0;}
  .ts-total{font-weight:600;font-family:var(--font-mono);}
  .ts-foot td{font-weight:600;border-top:1px solid var(--border);}

  /* ---------- Resourcing ---------- */
  .res-grid{display:grid;grid-template-columns:160px repeat(4,1fr);gap:6px;align-items:center;}
  .res-head{font-size:10.5px;text-transform:uppercase;color:var(--fg-faint);letter-spacing:.5px;font-weight:600;padding-bottom:6px;text-align:center;}
  .res-head:first-child{text-align:left;}
  .res-name{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;padding:6px 0;}
  .res-cell{
    border-radius:3px;padding:7px 6px;text-align:center;font-size:11.5px;font-weight:600;font-family:var(--font-mono);
  }
  .res-cell.under{background:var(--panel-raised);color:var(--fg-faint);}
  .res-cell.good{background:var(--ok-bg);color:var(--ok);}
  .res-cell.high{background:var(--warn-bg);color:var(--warn);}
  .res-cell.over{background:var(--bad-bg);color:var(--bad);}

  /* ---------- Project detail ---------- */
  .detail-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:14px;}
  .detail-stats{display:flex;gap:22px;flex-wrap:wrap;}
  .dstat .n{font-family:var(--font-display);font-weight:650;font-size:16px;font-variant-numeric:tabular-nums;}
  .dstat .l{font-size:10.5px;color:var(--fg-faint);text-transform:uppercase;letter-spacing:.5px;}
  .story-row{display:flex;align-items:center;gap:12px;padding:9px 2px;border-top:1px solid var(--border-soft);}
  .story-row:first-child{border-top:none;}
  .story-title{flex:1;min-width:0;font-size:12.5px;font-weight:450;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .story-meta{display:flex;align-items:center;gap:14px;flex:none;}

  .chart-wrap{overflow-x:auto;}
  .chart-wrap svg{display:block;}

  .stat-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--fg-faint);font-weight:600;margin-bottom:3px;}
  .stat-value{font-family:var(--font-display);font-weight:650;font-size:16px;}
  .mini-stats{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border-soft);}
  .week-bars{display:flex;gap:6px;}
  .week-bar-col{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;}
  .week-bar-track{width:100%;max-width:16px;height:32px;display:flex;align-items:flex-end;}
  .week-bar-fill{width:100%;border-radius:2px;background:var(--panel-raised-2);}
  .week-bar-fill.today{background:var(--fg-dim);}
  .week-bar-label{font-size:9px;color:var(--fg-faint);}

  .two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;align-items:start;}
  @media (max-width:980px){.two-col{grid-template-columns:1fr;}}

  @media (max-width:760px){
    .shell{flex-direction:column;}
    .sidebar{
      position:sticky;top:0;width:auto;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;
      border-right:none;border-bottom:1px solid var(--border-soft);z-index:15;padding:10px 12px;gap:8px;
    }
    .brand{padding:0;}
    nav.primary{flex-direction:row;flex-wrap:wrap;margin-bottom:0;gap:4px;}
    .side-section,.sidebar-foot{display:none;}
    .main{padding-top:14px;}
    .res-grid{grid-template-columns:110px repeat(4,1fr);font-size:11px;}
  }

  .toast{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--fg);color:var(--panel);padding:8px 14px;border-radius:4px;
    font-size:12.5px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
    z-index:40;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="17" cy="17" r="16" stroke="var(--fg)" stroke-width="2"/>
        <path d="M12 9 C 20 9, 24 13, 24 17 C 24 21, 20 25, 12 25" stroke="var(--fg)" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M12 9 L24 17 L12 25" stroke="var(--fg-dim)" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <div class="brand-text">
        <span class="product">Loom</span>
        <span class="maker">by <b>Bowstring</b></span>
      </div>
      <svg class="chev" width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M4.5 6L8 9.5L11.5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <nav class="primary" id="primary-nav"></nav>

    <div class="side-section">
      <h3>Active workspaces</h3>
      <div id="side-projects"></div>
    </div>

    <div class="sidebar-foot" id="sidebar-foot">
      <div class="avatar">Y</div>
      <div class="me"><b>You</b><span id="me-role">Connecting&hellip;</span></div>
      <div class="theme-toggle" role="group" aria-label="Theme">
        <button type="button" id="theme-dark" aria-label="Dark theme">●</button>
        <button type="button" id="theme-light" aria-label="Light theme">○</button>
        <button type="button" id="theme-system" aria-label="System theme">◐</button>
      </div>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="toast" id="toast">Saved</div>

<script>

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtMoney(n){
  return '$' + Math.round(n).toLocaleString('en-US');
}
function pct(a,b){ return b>0 ? Math.round((a/b)*100) : 0; }
function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
function sum(arr, fn){ return arr.reduce(function(s,x){ return s+fn(x); }, 0); }

function statusBarClass(p){
  var r = pct(p.loggedHours, p.budgetHours);

}

// in this artifact's database, so every teammate who opens the link sees and
// edits the same workspace. Each viewer's own timesheet lives in their private
// data/users/<id>/timesheet document, which only they can read or write.
var TS_DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

function mondayOf(d){
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var day = x.getDay();
  var diff = (day === 0 ? -6 : 1 - day);
  x.setDate(x.getDate() + diff);
  return x;
}
function isoDate(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtWeekLabel(monday){
  var end = new Date(monday); end.setDate(end.getDate()+6);
  var sameYear = monday.getFullYear() === end.getFullYear();
  var startStr = monday.toLocaleDateString('en-US', {month:'short', day:'numeric'});
  var endStr = end.toLocaleDateString('en-US', sameYear ? {month:'short', day:'numeric'} : {month:'short', day:'numeric', year:'numeric'});
  return startStr + '–' + endStr + ', ' + end.getFullYear();
}
var THIS_WEEK_MONDAY = mondayOf(new Date());
var currentWeekMonday = new Date(THIS_WEEK_MONDAY);

function allCoreReady(){
  return !!dataReady.team && !!dataReady.projects && !!dataReady.resourcing && !!dataReady.stats && !!dataReady.timesheet;
}

function seedTeam(){
  if (!canWrite) return;
  SEED_TEAM.forEach(function(u, i){
    db.collection('team').doc(u.id).set(Object.assign({order:i}, u)).catch(function(){});
  });
}
function seedProjects(){
  if (!canWrite) return;
  SEED_PROJECTS.forEach(function(p, i){
    db.collection('projects').doc(p.id).set(Object.assign({order:i}, p)).catch(function(){});
  });
}
function seedResourcing(){
  if (!canWrite) return;
  SEED_RESOURCING.forEach(function(r){
    db.collection('resourcing').doc(r.id).set(r).catch(function(){});
  });
}
function seedStats(){
  if (!canWrite) return;
  db.doc('stats/weekly-hours').set({values: SEED_WEEKLY_TOTALS}).catch(function(){});

function initData(){
  var loadTimer = setTimeout(function(){ loadTimedOut = true; onDataChange(); }, 10000);
  function settled(){ clearTimeout(loadTimer); }

  db.collection('team').onSnapshot(function(snap){
    settled();
    if (snap.empty){ seedTeam(); if (!canWrite){ TEAM = SEED_TEAM; dataReady.team = true; onDataChange(); } return; }
    TEAM = snap.docs.map(function(d){ return d.data(); }).sort(function(a,b){ return a.order - b.order; });
    dataReady.team = true;
    onDataChange();
  }, function(){ TEAM = SEED_TEAM; dataReady.team = 'error'; onDataChange(); });

  db.collection('projects').onSnapshot(function(snap){
    settled();
    if (snap.empty){ seedProjects(); if (!canWrite){ PROJECTS = SEED_PROJECTS; dataReady.projects = true; onDataChange(); } return; }
    PROJECTS = snap.docs.map(function(d){ return d.data(); }).sort(function(a,b){ return a.order - b.order; });
    dataReady.projects = true;
    onDataChange();
  }, function(){ PROJECTS = SEED_PROJECTS; dataReady.projects = 'error'; onDataChange(); });

  db.collection('resourcing').onSnapshot(function(snap){
    settled();
    if (snap.empty){ seedResourcing(); if (!canWrite){ RESOURCING = SEED_RESOURCING; dataReady.resourcing = true; onDataChange(); } return; }
    RESOURCING = snap.docs.map(function(d){ return d.data(); });
    dataReady.resourcing = true;
    onDataChange();
  }, function(){ RESOURCING = SEED_RESOURCING; dataReady.resourcing = 'error'; onDataChange(); });

  db.doc('stats/weekly-hours').onSnapshot(function(snap){
    settled();
    if (!snap.exists){ seedStats(); if (!canWrite){ WEEKLY_TOTALS = SEED_WEEKLY_TOTALS; dataReady.stats = true; onDataChange(); } return; }
    WEEKLY_TOTALS = snap.data().values;
    dataReady.stats = true;
    onDataChange();
  }, function(){ WEEKLY_TOTALS = SEED_WEEKLY_TOTALS; dataReady.stats = 'error'; onDataChange(); });

  subscribeTimesheet(settled);
}

function blankWeekRows(){
  return SEED_TIMESHEET.rows.map(function(r){ return {project:r.project, story:r.story, hours:[0,0,0,0,0,0,0]}; });
}

function subscribeTimesheet(onSettled){
  if (tsUnsubscribe){ tsUnsubscribe(); tsUnsubscribe = null; }
  var weekId = isoDate(currentWeekMonday);
  var isThisWeek = weekId === isoDate(THIS_WEEK_MONDAY);
  var label = fmtWeekLabel(currentWeekMonday);

  if (!myId){
    TIMESHEET = {days: TS_DAYS, weekLabel: label, rows: isThisWeek ? SEED_TIMESHEET.rows : blankWeekRows()};
    dataReady.timesheet = 'local';
    if (onSettled) onSettled();
    onDataChange();
    return;
  }

  var tsDoc = db.collection('data/users/'+myId).doc('week-'+weekId);
  tsUnsubscribe = tsDoc.onSnapshot(function(snap){
    if (onSettled) onSettled();
    if (!snap.exists){
      var seedRows = isThisWeek ? SEED_TIMESHEET.rows : blankWeekRows();
      if (canWrite && isThisWeek) tsDoc.set({weekLabel: label, rows: seedRows}).catch(function(){});
      TIMESHEET = {days: TS_DAYS, weekLabel: label, rows: seedRows};
    } else {
      TIMESHEET = Object.assign({days: TS_DAYS, weekLabel: label}, snap.data());
    }
    dataReady.timesheet = true;
    onDataChange();
  }, function(){
    TIMESHEET = {days: TS_DAYS, weekLabel: label, rows: isThisWeek ? SEED_TIMESHEET.rows : blankWeekRows()};
    dataReady.timesheet = 'error';
    onDataChange();
  });
}

function goToWeek(monday){
  currentWeekMonday = monday;
  subscribeTimesheet();
}

async function bootData(){
  var hasClaude = typeof claude !== 'undefined' && claude && typeof claude.use === 'function';
  db = hasClaude ? await claude.use('db') : null;
  userCap = hasClaude ? await claude.use('user') : null;
  if (!db){
    TEAM = SEED_TEAM; PROJECTS = SEED_PROJECTS; RESOURCING = SEED_RESOURCING;
    WEEKLY_TOTALS = SEED_WEEKLY_TOTALS;
    TIMESHEET = {days: TS_DAYS, weekLabel: fmtWeekLabel(currentWeekMonday), rows: SEED_TIMESHEET.rows};
    dataReady = {team:true, projects:true, resourcing:true, stats:true, timesheet:'local'};
    onDataChange();
    return;
  }
  myId = userCap ? await userCap.id() : null;
  canWrite = userCap ? !!(await userCap.can('data.write')) : false;
  initData();
}

var tsSaveTimer = null;
function scheduleTimesheetSave(){
  if (!myId || !canWrite) return;
  var weekId = isoDate(currentWeekMonday);
  clearTimeout(tsSaveTimer);
  tsSaveTimer = setTimeout(function(){
    db.collection('data/users/'+myId).doc('week-'+weekId).update({rows: TIMESHEET.rows, weekLabel: TIMESHEET.weekLabel}).catch(function(){});
  }, 700);
}

    {l:'Active projects', v:active.length, d: PROJECTS.length - active.length + ' completed this year'},

    }

      '<div class="vrow"><div class="v">'+k.v+'</div>'+deltaHtml+'</div>' +
      '<div class="d'+(k.cls?(' '+k.cls):'')+'">'+k.d+'</div></div>';
  }).join('') + '</div>';

  html += '<div class="two-col">';

  html += '<div class="panel"><div class="panel-head"><h2>Projects needing attention</h2><span class="sub">by budget health</span></div>';

    }).join('') + '</div>';

function yourWeekPanel(){
  var days = TIMESHEET.days;
  var totalsPerDay = days.map(function(_,di){ return sum(TIMESHEET.rows, function(r){ return r.hours[di]; }); });
  var weekTotal = sum(totalsPerDay, function(t){ return t; });
  var todayIdx = 2; // Wed, matching this workspace's current week
  var today = totalsPerDay[todayIdx] || 0;
  var util = Math.round((weekTotal / 40) * 100);
  var maxDay = Math.max.apply(null, totalsPerDay.concat([1]));

  return '<div class="panel"><div class="panel-head"><h2>Your week</h2><span class="sub">'+TIMESHEET.weekLabel+'</span></div>' +

    '</div>' +
    '<div class="week-bars">'+mini+'</div>' +
    '</div>';
}

function sparkBars(values){
  var w = 560, h = 190, padL = 8, padR = 8, padT = 26, padB = 24;
  var n = values.length;
  var max = Math.max.apply(null, values) * 1.12;
  var min = Math.min.apply(null, values) * 0.9;
  var innerW = w - padL - padR, innerH = h - padT - padB;
  var pts = values.map(function(v,i){
    var x = padL + (i/(n-1)) * innerW;
    var y = padT + innerH - ((v-min)/(max-min||1)) * innerH;
    return [x,y];
  });

  function smoothPath(points){
    var d = 'M '+points[0][0].toFixed(1)+' '+points[0][1].toFixed(1);
    for (var i=0;i<points.length-1;i++){
      var p0 = points[i], p1 = points[i+1];
      var midX = (p0[0]+p1[0])/2;
      d += ' C '+midX.toFixed(1)+' '+p0[1].toFixed(1)+', '+midX.toFixed(1)+' '+p1[1].toFixed(1)+', '+p1[0].toFixed(1)+' '+p1[1].toFixed(1);
    }
    return d;
  }
  var linePath = smoothPath(pts);

  var gridLines = [0,1,2,3].map(function(i){
    var y = padT + (innerH/3)*i;
    return '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+y.toFixed(1)+'" stroke="var(--border-soft)" stroke-width="1"/>';
  }).join('');

  var lastIdx = n-1;
  var lastPt = pts[lastIdx];
  var labelX = clamp(lastPt[0], 14, w-14);
  var callout = '<g>' +
    '<circle cx="'+lastPt[0].toFixed(1)+'" cy="'+lastPt[1].toFixed(1)+'" r="3" fill="var(--fg)"/>' +
    '<text x="'+labelX.toFixed(1)+'" y="'+Math.max(12,lastPt[1]-10).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="600" fill="var(--fg)" font-family="Inter, sans-serif">'+values[lastIdx]+'h</text>' +
    '</g>';

  var xLabels = values.map(function(v,i){
    return '<text x="'+pts[i][0].toFixed(1)+'" y="'+(h-6)+'" text-anchor="middle" font-size="9.5" fill="var(--fg-faint)" font-family="JetBrains Mono, monospace">W'+(i+1)+'</text>';
  }).join('');

  return '<div class="chart-wrap"><svg viewBox="0 0 '+w+' '+h+'" width="100%" style="max-width:560px;height:auto;">' +
    gridLines +
    '<path d="'+linePath+'" fill="none" stroke="var(--fg-dim)" stroke-width="1.75" stroke-linecap="round"/>' +
    callout + xLabels +
    '</svg></div>';
}

var MONTH_IDX = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
function parseMD(str){
  var m = /([A-Za-z]{3})\w*\s+(\d+)/.exec(str || '');
  if (!m) return null;
  return {mo: MONTH_IDX[m[1]], d: parseInt(m[2],10)};
}
function daysBetween(fromStr, toStr){
  var a = parseMD(fromStr), b = parseMD(toStr);
  if (!a || !b) return 0;
  var d0 = new Date(2000, a.mo, a.d);
  var d1 = new Date(2000, b.mo, b.d);
  if (d1 < d0) d1 = new Date(2001, b.mo, b.d);
  return Math.round((d1 - d0) / 86400000);
}

function ganttPanel(p){
  var totalDays = Math.max(1, daysBetween(p.start, p.due));
  var cursor = 0;
  var bars = p.stories.map(function(s){
    var segStart = cursor;
    var segEnd = Math.max(segStart + 2, daysBetween(p.start, s.due));
    segEnd = Math.min(segEnd, totalDays);
    cursor = segEnd;
    var left = (segStart/totalDays)*100;
    var width = Math.max(1.5, ((segEnd-segStart)/totalDays)*100);
    var fillPct = s.status==='done' ? 100 : (s.est>0 ? clamp(pct(s.logged,s.est),0,100) : 0);
    var fillColor = s.status==='done' ? 'var(--ok)' : (s.status==='in-progress' ? 'var(--warn)' : 'var(--fg-faint)');
    return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;">' +
      '<div style="width:170px;flex:none;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="'+escapeHtml(s.title)+'">'+escapeHtml(s.title)+'</div>' +
      '<div style="flex:1;position:relative;height:18px;background:var(--panel-raised);border-radius:3px;">' +
        '<div style="position:absolute;left:'+left.toFixed(2)+'%;width:'+width.toFixed(2)+'%;height:100%;border-radius:3px;background:var(--panel-raised-2);overflow:hidden;">' +
          '<div style="width:'+fillPct+'%;height:100%;background:'+fillColor+';opacity:.8;"></div>' +
        '</div>' +
      '</div>' +
      '<div style="width:58px;flex:none;font-size:11px;color:var(--fg-faint);text-align:right;font-family:var(--font-mono);">'+s.due+'</div>' +
      '</div>';
  }).join('');
  return '<div class="panel"><div class="panel-head"><h2>Gantt</h2><span class="sub">'+p.start+' – '+p.due+'</span></div>' +
    '<div>'+bars+'</div>' +
    '<div style="display:flex;gap:16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border-soft);font-size:11.5px;color:var(--fg-faint);">' +
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--ok);margin-right:5px;"></span>Done</span>' +
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--warn);margin-right:5px;"></span>In progress</span>' +
    '<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--panel-raised-2);margin-right:5px;"></span>To do</span>' +
    '</div></div>';
}

  var kpis = [
    {l:'Unbilled WIP', v:fmtMoney(wip), d:'work completed, not yet invoiced'},
    {l:'Outstanding invoices', v:fmtMoney(sum(open,function(i){return i.amount;})), d:open.length+' open'},
    {l:'Overdue (AP risk)', v:fmtMoney(sum(overdue,function(i){return i.amount;})), d:overdue.length>0?'needs follow-up':'nothing overdue', cls:overdue.length>0?'down':''},
    {l:'Paid this period', v:fmtMoney(sum(paid,function(i){return i.amount;})), d:'via QuickBooks sync'}
  ];

  var html = '<div class="topbar"><div><div class="crumb">Loom</div><h1>Billing</h1></div></div>';
  html += '<div class="grid-kpi">' + kpis.map(function(k){
    return '<div class="kpi"><div class="l">'+k.l+'</div><div class="vrow"><div class="v">'+k.v+'</div></div>' +
      '<div class="d'+(k.cls?(' '+k.cls):'')+'">'+k.d+'</div></div>';
  }).join('') + '</div>';

  var rows = SEED_INVOICES.map(function(i){
    var p = projectById(i.project) || {name:i.project, client:''};
    return '<tr><td class="mono">'+i.number+'</td>' +
      '<td><div class="pname" style="font-size:12.5px;">'+escapeHtml(p.name)+'</div><div class="pclient">'+escapeHtml(p.client)+'</div></td>' +
      '<td><span class="pill '+INVOICE_STATUS_COLOR[i.status]+'">'+INVOICE_STATUS_LABEL[i.status]+'</span></td>' +
      '<td class="mono num">'+fmtMoney(i.amount)+'</td>' +
      '<td class="muted nowrap">'+i.issued+'</td>' +
      '<td class="muted nowrap">'+i.due+'</td></tr>';
  }).join('');
  html += '<div class="panel"><div class="panel-head"><h2>Invoices</h2><span class="sub">synced from QuickBooks</span></div>' +
    '<div class="scroll-x"><table><thead><tr><th>Invoice</th><th>Project</th><th>Status</th><th class="num">Amount</th><th>Issued</th><th>Due</th></tr></thead><tbody>'+rows+'</tbody></table></div>' +
    '</div>';

  html += '<div class="panel"><div class="panel-head"><h2>Expenses &amp; payments</h2><span class="sub">bill.com</span></div>' +
    '<p class="muted" style="font-size:12.5px;margin:0 0 16px;">Expense entries and vendor payments reconcile against project budgets automatically once bill.com approves them.</p>' +
    '<div class="mini-stats" style="border-bottom:none;padding-bottom:0;">' +
    '<div><div class="stat-label">Pending approval</div><div class="stat-value">3</div></div>' +
    '<div><div class="stat-label">Approved, unpaid</div><div class="stat-value">'+fmtMoney(6400)+'</div></div>' +
    '<div><div class="stat-label">Paid this month</div><div class="stat-value">'+fmtMoney(14200)+'</div></div>' +
    '</div></div>';

  return html;
}

function resCellClass(w){
  if (w > 105) return 'over';
  if (w >= 85) return 'good';
  if (w >= 50) return 'high';
  return 'under';
}

function viewResourcing(){
  var weekLabels = ['This week','Next week','Week 3','Week 4'];
  var html = '<div class="topbar"><div><div class="crumb">Loom</div><h1>Resourcing</h1></div></div>';
  html += '<div class="panel"><div class="panel-head"><h2>Team capacity</h2><span class="sub">% of a 40h week allocated across active projects</span></div>';

  var cellsHtml = '<div class="res-head">Teammate</div>' + weekLabels.map(function(w){ return '<div class="res-head">'+w+'</div>'; }).join('');
  RESOURCING.forEach(function(r){
    var u = user(r.id);
    cellsHtml += '<div class="res-name">'+avatarEl(u,26)+'<span>'+escapeHtml(u.name)+'</span></div>';
    cellsHtml += r.weeks.map(function(w){
      return '<div class="res-cell '+resCellClass(w)+'">'+w+'%</div>';
    }).join('');
  });
  html += '<div class="res-grid">'+cellsHtml+'</div>';

  html += '</div>';
  return html;
}

// ================= Shell render =================
function render(){
  renderNav();
  var main = document.getElementById('main');
  if (!allCoreReady() && !loadTimedOut){ main.innerHTML = loadingHtml(); return; }
  var route = currentRoute();
  if (route.view === 'dashboard') main.innerHTML = viewDashboard();
  else if (route.view === 'projects') { main.innerHTML = viewProjects(); bindProjectsView(); }
  else if (route.view === 'project') { main.innerHTML = viewProject(route.id); bindProjectDetailView(); }
  else if (route.view === 'time') { main.innerHTML = viewTime(); bindTimeView(); }
  else if (route.view === 'resourcing') main.innerHTML = viewResourcing();
  else if (route.view === 'billing') main.innerHTML = viewBilling();
  else if (route.view === 'integrations') { main.innerHTML = viewIntegrations(); bindIntegrationsView(); }
  else main.innerHTML = viewDashboard();

  var newBtn = document.getElementById('new-project-btn');
  if (newBtn) newBtn.addEventListener('click', function(){ flashToast('New-project wizard is a prototype placeholder'); });
}

window.addEventListener('hashchange', render);

// ================= Toast =================
var toastEl = document.getElementById('toast');
var toastTimer;
function flashToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
}

// ================= Theme =================
function setTheme(mode){
  if (mode === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', mode);
  try { localStorage.setItem('loom-theme', mode); } catch(e){}
  ['dark','light','system'].forEach(function(m){
    document.getElementById('theme-'+m).classList.toggle('active', m===mode);
  });
}
document.getElementById('theme-dark').addEventListener('click', function(){ setTheme('dark'); });
document.getElementById('theme-light').addEventListener('click', function(){ setTheme('light'); });
document.getElementById('theme-system').addEventListener('click', function(){ setTheme('system'); });
var savedTheme = 'light';
try { savedTheme = localStorage.getItem('loom-theme') || 'light'; } catch(e){}
setTheme(savedTheme);

render();
bootData();
})();
</script>
